{% load static inv %}
<header class="shop-top">
  <a class="brand shop-brand" href="{% url 'tienda' %}"><span class="brand-logo"><img src="{% static 'img/logo.png' %}" alt="MagnusSIG"></span><b>Tienda</b></a>
  <div class="top-r">
    <a class="btn btn-out" href="{% url 'carrito' %}">{% icon 'cart' 17 %} Carrito ({{ items_carrito }})</a>
    <div class="user"><span class="avatar">{{ iniciales }}</span>
      <div><b>{{ nombre_usuario }}</b><small>{{ rol }}</small></div></div>
    <a class="btn btn-out" href="{% url 'logout' %}">{% icon 'logout' 15 %} Cerrar sesión</a>
  </div>
</header>
